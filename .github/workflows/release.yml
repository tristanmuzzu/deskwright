name: Release

# Tag-driven. `git tag v0.1.1 && git push --tags` builds, checks and publishes.
#
# Uses PyPI Trusted Publishing, so there is NO API token in this repository.
# One-time setup, on pypi.org -> the project -> Publishing -> Add a pending
# publisher:
#   Owner: tristanmuzzu   Repository: wayland-computer-use
#   Workflow: release.yml  Environment: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # The tag has to name the version that is actually in the artifacts, or
      # the registry entry and the release notes point at something that does
      # not exist.
      - name: the tag matches the package version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          pkg = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != pkg:
              sys.exit(f"tag {tag!r} != pyproject version {pkg!r}")
          print("tag and version agree:", pkg)
          PY

      # Same guard the CI workflow runs: a wheel that quietly lost the
      # extension still installs, and then fails after the user's logout.
      - name: every tracked extension file is in the wheel and the sdist
        run: |
          python - <<'PY'
          import glob, subprocess, sys, tarfile, zipfile
          tracked = set(subprocess.run(["git", "ls-files", "wcu/extension"],
                                       capture_output=True, text=True,
                                       check=True).stdout.split())
          if not tracked:
              sys.exit("no tracked files under wcu/extension")
          wheel = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as tar:
              sdist = {n.split("/", 1)[1] for n in tar.getnames() if "/" in n}
          for label, shipped in (("wheel", wheel), ("sdist", sdist)):
              missing = sorted(tracked - shipped)
              if missing:
                  sys.exit(f"{label} is missing: " + ", ".join(missing))
          print(f"all {len(tracked)} tracked extension files ship in both")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing; no token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](CHANGELOG.md). Attach the demo video before publishing this draft."
