name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # PyGObject has no PyPI wheels, so it comes from apt here for the same
      # reason it comes from apt on a user's machine. The runner has no
      # Wayland session: the suites that need one are scripts with their own
      # main() and are not collected (tests/conftest.py says which).
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-glib-2.0 gir1.2-atspi-2.0 libgirepository-1.0-1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e .

      - name: lint
        run: ruff check .

      - name: tests
        run: python -m pytest -q

  build:
    name: wheel carries the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # The install story is "no checkout anywhere", which is only true if the
      # gnome-shell extension is inside the wheel. Prove it every build.
      - name: the gnome-shell extension is in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = [
              "wcu/extension/wcu@wayland-computer-use/metadata.json",
              "wcu/extension/wcu@wayland-computer-use/extension.js",
              "wcu/extension/wcu@wayland-computer-use/dbus.js",
              "wcu/extension/wcu@wayland-computer-use/indicator.js",
              "wcu/extension/wcu@wayland-computer-use/schemas/gschemas.compiled",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("wheel is missing: " + ", ".join(missing))
          print("extension present in the wheel:", len(need), "files")
          PY

  server-json:
    name: server.json matches the registry schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema requests
      - name: validate
        run: |
          python - <<'PY'
          import json, requests, sys, tomllib
          doc = json.load(open("server.json"))
          schema = requests.get(doc["$schema"], timeout=30).json()
          import jsonschema
          jsonschema.validate(doc, schema)
          # A registry entry that points at a version nobody published is worse
          # than no entry, so the three versions must agree.
          pkg = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          entry = doc["packages"][0]["version"]
          if not (doc["version"] == entry == pkg):
              sys.exit(f"version drift: server.json {doc['version']}, "
                       f"package entry {entry}, pyproject {pkg}")
          print("server.json valid, version", pkg)
          PY
