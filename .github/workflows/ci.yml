name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The job that has to pass. It runs on the DISTRO python, because that is the
  # only interpreter on a GitHub runner that can import PyGObject: apt installs
  # gi into /usr/lib/python3/dist-packages, and `actions/setup-python` provides
  # a completely separate interpreter that cannot see it. Getting that wrong is
  # how eight portal tests errored on the first CI run of this file.
  tests:
    name: lint + tests (distro python, with PyGObject)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-venv gir1.2-glib-2.0 gir1.2-atspi-2.0 \
            libgirepository-1.0-1

      # --system-site-packages is the same shape the README tells users to
      # install with, so CI exercises the documented environment rather than a
      # cleaner one that nobody has.
      - name: install
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ruff pytest
          .venv/bin/pip install -e .

      - name: PyGObject and the AT-SPI typelib are really importable
        run: |
          .venv/bin/python - <<'PY'
          import gi
          gi.require_version("Atspi", "2.0")
          from gi.repository import Atspi  # noqa: F401
          print("gi and Atspi import fine")
          PY

      - name: lint
        run: .venv/bin/ruff check .

      # -rs prints the reason for every skip, and the check below fails if there
      # is one. On this interpreter nothing has an excuse to skip, so a skip
      # means a test quietly stopped covering anything.
      - name: tests
        run: |
          .venv/bin/python -m pytest -q -rs | tee /tmp/pytest.out
          if grep -qE '[0-9]+ skipped' /tmp/pytest.out; then
            echo "::error::a test skipped on the interpreter that has PyGObject"
            exit 1
          fi

  # Everything that is pure Python, across the versions pyproject claims to
  # support. The portal tests skip here by design: PyGObject has no wheels, so
  # a setup-python interpreter cannot have it, and pretending otherwise would
  # mean building it from source on every run. The job above is what covers
  # them.
  versions:
    name: tests (python ${{ matrix.python }}, no PyGObject)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest -e .
      - run: python -m pytest -q -rs

  build:
    name: wheel carries the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # The install story is "no checkout anywhere", which is only true if the
      # gnome-shell extension is inside the wheel. A hardcoded filename list
      # would not notice a NEW extension file that package-data failed to
      # pick up, so this diffs what git tracks against what shipped.
      - name: every tracked extension file is in the wheel and the sdist
        run: |
          python - <<'PY'
          import glob, subprocess, sys, tarfile, zipfile
          tracked = set(subprocess.run(
              ["git", "ls-files", "deskwright/extension"],
              capture_output=True, text=True, check=True).stdout.split())
          if not tracked:
              sys.exit("no tracked files under deskwright/extension -- wrong checkout?")
          wheel = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as tar:
              # sdist members are prefixed with <name>-<version>/
              sdist = {n.split("/", 1)[1] for n in tar.getnames() if "/" in n}
          for label, shipped in (("wheel", wheel), ("sdist", sdist)):
              missing = sorted(tracked - shipped)
              if missing:
                  sys.exit(f"{label} is missing: " + ", ".join(missing))
          print(f"all {len(tracked)} tracked extension files ship in both")
          PY

  server-json:
    name: server.json matches the registry schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema requests
      - name: validate
        run: |
          python - <<'PY'
          import json, requests, sys, tomllib
          doc = json.load(open("server.json"))
          schema = requests.get(doc["$schema"], timeout=30).json()
          import jsonschema
          jsonschema.validate(doc, schema)
          # A registry entry that points at a version nobody published is worse
          # than no entry, so the three versions must agree.
          pkg = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          entry = doc["packages"][0]["version"]
          if not (doc["version"] == entry == pkg):
              sys.exit(f"version drift: server.json {doc['version']}, "
                       f"package entry {entry}, pyproject {pkg}")
          print("server.json valid, version", pkg)
          PY
