# The whole runtime ships in the wheel: the MCP server, the four compositor
# backends, and the gnome-shell extension as package data. That is what makes
#
#     pipx install --system-site-packages deskwright && deskwright-setup
#
# a complete install with no checkout anywhere.
#
# `--system-site-packages` is not decoration. PyGObject has no wheels on PyPI
# (verified 2026-08-30: "all versions of pygobject have no usable wheels"), it
# is a system package everywhere -- python3-gi / python3-gobject /
# python-gobject -- and building it from source needs girepository and cairo
# headers most machines do not have. So it is deliberately absent from
# `dependencies`, and the venv is told to see the distro's copy instead.
# `deskwright-setup --check` reports it by name with the exact install line.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deskwright"
version = "0.1.0"
description = "An AI agent uses a real GNOME/Wayland desktop: pressing actual widgets rather than guessing at pixels, optionally on an invisible second GNOME session so your own screen stays yours."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Rafe Muzzu", email = "tristan@zeticle.com" }]
keywords = [
    "mcp", "model-context-protocol", "computer-use", "ai-agents",
    "wayland", "gnome", "desktop-automation", "accessibility", "at-spi",
    "claude", "linux",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Gnome",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Software Development :: Testing",
    "Topic :: Adaptive Technologies",
]
dependencies = [
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/tristanmuzzu/deskwright"
Source = "https://github.com/tristanmuzzu/deskwright"
Issues = "https://github.com/tristanmuzzu/deskwright/issues"
Changelog = "https://github.com/tristanmuzzu/deskwright/blob/main/CHANGELOG.md"
Security = "https://github.com/tristanmuzzu/deskwright/blob/main/SECURITY.md"

[project.scripts]
# The MCP server. Register a client against this name, not against a path
# inside a checkout: `claude mcp add deskwright --scope user --
# deskwright`. `mcp_server.py` in a clone is the same entry point.
deskwright = "deskwright.cli:main"
# Fresh-machine setup and checker: dependencies, the accessibility flag, the
# bundled gnome-shell extension, and the client registration line.
deskwright-setup = "deskwright.setup_cli:main"
# Lifecycle of the invisible second (virtual-monitor) session.
deskwright-headless = "deskwright.headless:main"
# The two hands-on CLIs the README walks through. They exist as console
# scripts because after `pipx install` there is no checkout and no `deskwright` on
# the system python's path, so `python3 -m deskwright.atspi_ui` -- which is what the
# docs used to say -- answered "No module named 'deskwright'".
deskwright-atspi = "deskwright.atspi_ui:main"
deskwright-desktop = "deskwright.desktop:main"

[tool.setuptools]
packages = ["deskwright"]

[tool.setuptools.package-data]
# The gnome-shell extension travels with the wheel -- `deskwright-setup` copies it
# out of the package into ~/.local/share/gnome-shell/extensions.
# Everything, recursively. A per-suffix allowlist silently drops whatever it
# was not told about -- a stylesheet.css, an icons/ directory, a po/ -- and
# the failure surfaces only as gnome-shell refusing to load the extension
# after a logout. CI diffs `git ls-files deskwright/extension` against the wheel.
deskwright = ["extension/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The desktop is an unreliable peer: AT-SPI, D-Bus and the portal all raise
# arbitrary toolkit exceptions, and a tool that dies on one is worse than a
# tool that degrades. Blanket-except rules are off for that reason, not by
# neglect -- every such site either falls back or re-raises a ToolError.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are prose in docstrings; line-length still applies to code
    "B008",    # call-in-default is used deliberately for the seams
    "SIM105",  # contextlib.suppress reads worse than the try/except it replaces here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # sys.path bootstrap before imports, on purpose
"mcp_server.py" = ["E402"]  # session pinning must run before the re-exports
# gi.require_version() has to run before `from gi.repository import ...`;
# that is PyGObject's documented idiom, not a stray import.
"deskwright/screencast.py" = ["E402"]
"deskwright/remote_input.py" = ["E402"]
"deskwright/portal_input.py" = ["E402"]
"deskwright/atspi_ui.py" = ["E402"]
